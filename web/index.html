/* ========== 番茄钟（时间戳驱动：WebView2 页面不可见时 setInterval 被节流至 1Hz，
   用剩余毫秒数而非 tick 计数，节流/休眠都不丢时；到点走系统 toast 通知） ========== */

const POMO = { focus: 25, rest: 5, mode: 'focus', total: 25 * 60, remain: 25 * 60, endAt: null, running: false };
let pomoCfgLoaded = false;   // 时长配置是否已从 config 恢复过（防每次唤起重置暂停状态）
const RING_LEN = 2 * Math.PI * 52;   // r=52 周长
const pomoLen = () => (POMO.mode === 'focus' ? POMO.focus : POMO.rest) * 60;

function pomoRender() {
  const m = Math.floor(POMO.remain / 60), s = Math.floor(POMO.remain % 60);
  $('#pomo-time').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  $('#pomo-ring').style.strokeDasharray = RING_LEN;
  $('#pomo-ring').style.strokeDashoffset = RING_LEN * (1 - POMO.remain / POMO.total);
  const isBreak = POMO.mode === 'rest';
  $('#pomo-mode').textContent = isBreak ? `☕ 休息 ${POMO.rest}′` : `🍅 专注 ${POMO.focus}′`;
  $('#pomo-toggle').textContent = POMO.running ? '暂停' : (POMO.remain < POMO.total ? '继续' : '开始');
  $('#pomo-state').textContent = POMO.running
    ? (isBreak ? '休息中…' : '专注中…')
    : (POMO.remain < POMO.total ? '已暂停' : (isBreak ? '准备休息' : '准备专注'));
  $('.pomo-ring').classList.toggle('break', isBreak);
}

function pomoToggle() {
  if (POMO.running) {                       // 暂停：冻结剩余秒数
    POMO.remain = Math.max(0, (POMO.endAt - Date.now()) / 1000);
    POMO.running = false; POMO.endAt = null;
  } else {                                  // 开始/继续：按剩余秒数定终点
    POMO.endAt = Date.now() + POMO.remain * 1000;
    POMO.running = true;
  }
  pomoRender();
}

function pomoSwitchMode() {
  POMO.mode = POMO.mode === 'focus' ? 'rest' : 'focus';
  POMO.total = pomoLen(); POMO.remain = POMO.total;
  POMO.running = false; POMO.endAt = null;
  pomoRender();
}

function pomoReset() {
  POMO.total = pomoLen(); POMO.remain = POMO.total;
  POMO.running = false; POMO.endAt = null;
  pomoRender();
}

function pomoFinish() {
  POMO.running = false; POMO.endAt = null; POMO.remain = 0;
  const wasFocus = POMO.mode === 'focus';
  if (wasFocus) {
    // 完成一段专注即落盘（今日看板/顶部条/日报素材四的数据源；只保最近 60 天）
    const tk = dayKey(new Date());
    CFG.pomo_log = (CFG.pomo_log || []).filter(x => x.date >= dayKey(new Date(Date.now() - 60 * 864e5)));
    CFG.pomo_log.push({ date: tk, focus_min: POMO.focus, at: new Date().toISOString() });
    persist();
  }
  api.notify('YY工具箱 · 番茄钟',
    wasFocus ? `🍅 专注 ${POMO.focus} 分钟完成，休息一下吧！` : '☕ 休息结束，继续专注！');
  pomoSwitchMode();                          // 自动切到另一模式待命
}

/* ---- 时长配置（⚙）：双输入 + 校验，持久化到 config（下次启动恢复） ---- */
function showPomoConfig() {
  return new Promise(resolve => {
    const mask = $('#modal-mask'), m = $('#modal');
    m.innerHTML = `<h3>番茄钟时长</h3>
      <div class="pomo-cfg-row"><label>专注（分钟）</label><input id="pc-focus" type="number" min="1" max="180" value="${POMO.focus}"></div>
      <div class="pomo-cfg-row"><label>休息（分钟）</label><input id="pc-rest" type="number" min="1" max="60" value="${POMO.rest}"></div>
      <div class="err" id="pc-err"></div>
      <div class="btns"><button id="m-cancel">取消</button><button class="primary" id="m-ok">保存</button></div>`;
    mask.classList.add('show');
    const fi = $('#pc-focus'), ri = $('#pc-rest');
    fi.focus(); fi.select();
    const done = v => { closeModal(); resolve(v); };
    $('#m-ok').addEventListener('click', () => {
      const f = parseInt(fi.value, 10), r = parseInt(ri.value, 10);
      if (!(f >= 1 && f <= 180)) return $('#pc-err').textContent = '专注时长须为 1–180 的整数';
      if (!(r >= 1 && r <= 60)) return $('#pc-err').textContent = '休息时长须为 1–60 的整数';
      done({ focus: f, rest: r });
    });
    $('#m-cancel').addEventListener('click', () => done(null));
    fi.addEventListener('keydown', ev => { if (ev.key === 'Enter') ri.focus(); });
    ri.addEventListener('keydown', ev => { if (ev.key === 'Enter') $('#m-ok').click(); });
  });
}

$('#pomo-cfg').addEventListener('click', async () => {
  const v = await showPomoConfig();
  if (!v) return;
  POMO.focus = v.focus; POMO.rest = v.rest;
  CFG.pomo_focus = v.focus; CFG.pomo_rest = v.rest;   // 持久化（下次启动恢复）
  persist();
  if (!POMO.running) {                                 // 空闲态立即按新时长重置显示；计时中不打断，下次生效
    POMO.total = pomoLen(); POMO.remain = POMO.total; POMO.endAt = null;
  }
  pomoRender();
});

setInterval(() => {
  if (!POMO.running) return;
  POMO.remain = (POMO.endAt - Date.now()) / 1000;
  if (POMO.remain <= 0) return pomoFinish();
  pomoRender();
}, 500);

$('#pomo-toggle').addEventListener('click', pomoToggle);
$('#pomo-mode').addEventListener('click', pomoSwitchMode);
$('#pomo-reset').addEventListener('click', pomoReset);
renderWidgetTabs();
pomoRender();

/* ========== 记事本（多页：notes_pages 数组 + notes_page 当前页；内容防抖持久化） ========== */

let notesBound = false;   // 编辑器是否已绑定过服务端数据（首次绑定后编辑器即事实源）

function notesNormalize() {
  if (!Array.isArray(CFG.notes_pages)) CFG.notes_pages = [];
  // 旧版单字段迁移：非空 notes → 第 1 页
  if (typeof CFG.notes === 'string' && CFG.notes) {
    if (!CFG.notes_pages.length) CFG.notes_pages = [CFG.notes];
    delete CFG.notes;
  }
  if (!CFG.notes_pages.length) CFG.notes_pages = [''];
  if (typeof CFG.notes_page !== 'number' || CFG.notes_page < 0 || CFG.notes_page >= CFG.notes_pages.length) {
    CFG.notes_page = 0;
  }
}

function renderNotesPager() {
  $('#np-ind').textContent = `${CFG.notes_page + 1} / ${CFG.notes_pages.length}`;
  $('#np-prev').disabled = CFG.notes_page <= 0;
  $('#np-next').disabled = CFG.notes_page >= CFG.notes_pages.length - 1;
}

function gotoNotesPage(i) {
  const ed = $('#notes-editor');
  CFG.notes_pages[CFG.notes_page] = ed.innerHTML;          // 存住当前页
  if (i >= CFG.notes_pages.length) CFG.notes_pages.push('');   // 越界目标 = 新建一页
  CFG.notes_page = Math.max(0, i);
  ed.innerHTML = CFG.notes_pages[CFG.notes_page] ?? '';
  renderNotesPager();
  persist();                                                // 翻页低频，立即落盘记住页码
}

(function initNotes() {
  const editor = $('#notes-editor');
  notesNormalize();
  editor.innerHTML = CFG.notes_pages[CFG.notes_page];
  renderNotesPager();

  // 工具栏：mousedown 阻止默认（防编辑区失焦丢选区），click 执行命令
  document.querySelectorAll('.notes-toolbar .nt-btn').forEach(btn => {
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      editor.focus();                                    // 选区保住后再聚焦
      if (btn.dataset.size) document.execCommand('fontSize', false, btn.dataset.size);
      else document.execCommand(btn.dataset.cmd, false, null);
      notesPersist();
    });
  });
  $('#np-prev').addEventListener('click', () => gotoNotesPage(CFG.notes_page - 1));
  $('#np-next').addEventListener('click', () => gotoNotesPage(CFG.notes_page + 1));
  $('#np-add').addEventListener('click', () => gotoNotesPage(CFG.notes_pages.length));
  $('#np-del').addEventListener('click', () => {
    if (CFG.notes_pages.length <= 1) {           // 仅剩一页：清空内容保底一页
      CFG.notes_pages = ['']; CFG.notes_page = 0;
    } else {
      CFG.notes_pages.splice(CFG.notes_page, 1); // 删当前页，索引停在原下一页；删末页则回退
      if (CFG.notes_page >= CFG.notes_pages.length) CFG.notes_page = CFG.notes_pages.length - 1;
    }
    editor.innerHTML = CFG.notes_pages[CFG.notes_page] ?? '';
    renderNotesPager(); persist();
  });
  // 输入即存（防抖，只存当前页）；粘贴强制纯文本，避免外部样式污染
  editor.addEventListener('input', notesPersist);
  editor.addEventListener('paste', e => {
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  });
  // 光标处命令状态回显（B/I/S 生效中高亮）
  document.addEventListener('selectionchange', () => {
    if (!document.activeElement || document.activeElement !== editor) return;
    document.querySelectorAll('.notes-toolbar .nt-btn[data-cmd]').forEach(btn => {
      try { btn.classList.toggle('on', document.queryCommandState(btn.dataset.cmd)); }
      catch (e) { /* 部分命令不支持状态查询，忽略 */ }
    });
  });
  let t = null;
  function notesPersist() {
    clearTimeout(t);
    t = setTimeout(() => {
      CFG.notes_pages[CFG.notes_page] = editor.innerHTML;
      persist();
    }, 300);
  }
})();

/* ========== 模态组件（Promise 化，替代原生 prompt/confirm） ========== */

let modalCloseTimer = null;

function closeModal() {
  const mask = $('#modal-mask');
  if (mask.classList.contains('closing')) return;    // 防重入（Enter 连击）
  mask.classList.add('closing');                     // 先播 150ms 出场动画再摘 show
  $('#modal').classList.remove('wide');              // 日报向导宽模态标志一并还原
  clearTimeout(modalCloseTimer);
  modalCloseTimer = setTimeout(() => mask.classList.remove('show', 'closing'), 160);
}

function reopenModal() {
  /* closeModal 出场动画期间立即重开模态（设置返回向导场景）。
     竞态实锤 2026-09-07：设置关闭走 closeModal+60ms 后重建向导，closeModal 的 160ms
     延迟摘除回调晚于向导重开执行，把刚显示的日报弹窗又关掉了——重开前必须先取消挂起的回调 */
  clearTimeout(modalCloseTimer); modalCloseTimer = null;
  const mask = $('#modal-mask');
  mask.classList.remove('closing');
  mask.classList.add('show');
}

function showInput(title, label, value) {
  return new Promise(resolve => {
    const mask = $('#modal-mask'), m = $('#modal');
    m.innerHTML = `<h3>${title}</h3><input id="modal-in" placeholder="${label}" value="${value.replace(/"/g, '&quot;')}">
      <div class="err" id="modal-err"></div>
      <div class="btns"><button id="m-cancel">取消</button><button class="primary" id="m-ok">确定</button></div>`;
    mask.classList.add('show');
    const input = $('#modal-in'); input.focus(); input.select();
    const done = v => { closeModal(); resolve(v); };
    $('#m-ok').addEventListener('click', () => {
      const v = input.value.trim();
      if (!v) return $('#modal-err').textContent = '名称不能为空';
      done(v);
    });
    $('#m-cancel').addEventListener('click', () => done(null));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') $('#m-ok').click();
      if (ev.key === 'Escape') done(null);
    });
  });
}
function showConfirm(title, body) {
  return new Promise(resolve => {
    const mask = $('#modal-mask'), m = $('#modal');
    m.innerHTML = `<h3>${title}</h3><p class="body">${body}</p><div class="err"></div>
      <div class="btns"><button id="m-cancel">取消</button><button class="primary" id="m-ok">确定</button></div>`;
    mask.classList.add('show');
    const done = v => { closeModal(); resolve(v); };
    $('#m-ok').addEventListener('click', () => done(true));
    $('#m-cancel').addEventListener('click', () => done(false));
  });
}

/* ========== 启动（pywebview 桥注入存在竞态：WebView2 的文档创建前脚本注册晚于
   首次导航时，本页面会完全错过注入——事件等待之外再加轮询双保险） ========== */

let booted = false;
function boot() {
  if (booted || !(window.pywebview && window.pywebview.api)) return;
  booted = true;
  api = pywebview.api;
  loadData().catch(() => toast('数据加载失败'));
}
window.addEventListener('pywebviewready', boot);
let waited = 0;
const poll = setInterval(() => {
  if (booted) { clearInterval(poll); return; }
  if (window.pywebview && window.pywebview.api) { clearInterval(poll); boot(); }
  else if (++waited > 300) clearInterval(poll);   // 30 秒放弃（浏览器直接打开等场景）
}, 100);
// 连接中提示（桥就绪后由 loadData 渲染覆盖）
if (!(window.pywebview && window.pywebview.api)) {
  $('#grid').innerHTML = '<div class="empty">正在连接本地服务…（若长时间无响应，请通过 启动.bat 启动）</div>';
}
// 面板每次唤起时自感知刷新：SetForegroundWindow 成功 → window focus 事件（主通道）
// + visibilitychange（屏显状态变化时，兜底通道）。热键线程 evaluate_js 会概率性卡死，已弃用
window.addEventListener('focus', () => { if (api) loadData().catch(() => {}); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    document.body.classList.remove('app-in');   // 重放唤起入场动画
    void document.body.offsetWidth;
    document.body.classList.add('app-in');
    if (api) loadData().catch(() => {});
  }
});
</script>
